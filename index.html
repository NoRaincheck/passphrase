<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taxonomy passphrase</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a21; --line:#262f3a; --ink:#e6edf3;
    --dim:#8b98a5; --acc:#7ee0c0; --bad:#ff8fa3;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --w1:#7ee0c0; --w2:#8ab4ff; --w3:#f0b866; --w4:#c9a2ff;
    --w5:#ff9fb4; --w6:#a8e05f;
  }
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 var(--mono);display:grid;place-items:center;min-height:100vh;padding:24px}
  .box{width:100%;max-width:680px}
  h1{font-size:18px;margin:0 0 4px;font-weight:600}
  .sub{color:var(--dim);font-size:13px;margin-bottom:22px}
  form{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
  label{color:var(--dim);font-size:13px}
  select,button{font:inherit;color:var(--ink);background:var(--panel);
                border:1px solid var(--line);border-radius:7px;padding:9px 13px}
  button{background:var(--acc);color:#0e1116;border-color:var(--acc);
         font-weight:600;cursor:pointer}
  button:hover{filter:brightness(1.08)}
  button.ghost{background:var(--panel);color:var(--ink);border-color:var(--line);font-weight:400}
  .chk{display:inline-flex;align-items:center;gap:7px;color:var(--dim);font-size:13px;
       background:var(--panel);border:1px solid var(--line);border-radius:7px;
       padding:8px 12px;cursor:pointer;user-select:none}
  .chk input{accent-color:var(--acc);width:15px;height:15px;margin:0;cursor:pointer}
  .chk:has(input:checked){color:var(--ink);border-color:var(--acc)}
  .out{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px}
  .phrase{font-size:20px;line-height:1.6;word-break:break-all;user-select:all;
          min-height:1.6em}
  .phrase .w{color:var(--w1)}
  .phrase .h{color:var(--acc)}
  hr{border:0;border-top:1px solid var(--line);margin:16px 0}
  dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:13px}
  dt{color:var(--dim)}
  dd{margin:0;word-break:break-all}
  .foot{margin-top:18px;font-size:12px;color:var(--dim)}
  .ok{color:var(--acc)} .bad{color:var(--bad)}
  pre{background:var(--panel);border:1px solid var(--line);border-radius:9px;
      padding:12px;overflow:auto;font-size:12px;color:var(--dim);margin:10px 0 0}
  summary{cursor:pointer;color:var(--dim)}
</style>
</head>
<body>
<div class="box">
  <h1>Taxonomy passphrase</h1>
  <div class="sub">1296 words &middot; 6&times;6&times;6&times;6 &middot; one checker hash</div>

  <form id="f">
    <label for="n">words</label>
    <select id="n" aria-label="number of words">
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4" selected>4</option>
    </select>
    <label class="chk"><input type="checkbox" id="tc">title case</label>
    <label for="sep">sep</label>
    <select id="sep" aria-label="separator">
      <option value="." selected>.</option>
      <option value="-">-</option>
    </select>
    <button type="submit">generate</button>
    <button type="button" class="ghost" id="copy">copy</button>
  </form>

  <div class="out">
    <div class="phrase" id="phrase" aria-live="polite">&mdash;</div>
    <hr>
    <dl>
      <dt>words</dt>   <dd id="rwords">&mdash;</dd>
      <dt>codes</dt>   <dd id="rcodes">&mdash;</dd>
      <dt>hash code</dt><dd id="rcode">&mdash;</dd>
      <dt>hash</dt>    <dd id="rhash">&mdash;</dd>
    </dl>
  </div>

  <div class="foot">
    <span id="status">list: &mdash;</span>
    <div>title case and sep are display-only &middot; the checker hash is never re-cased</div>
  </div>
</div>

<script type="text/plain" id="twoletter">
AA AB AD AE AG AH AM AN AR AS AT AW AX AY
EA ED EE EF EH EM EN ER ES ET EW EX
UG UH UM UN UP UR US UT
BA BE BY CH DA DE FA FE FY GU HA HE HM
JA KA KY MA ME MM MU MY NA NE NU NY
PA PE RE SH ST TA TE WE XU YA YE YU ZA
</script>
<script>
"use strict";

/* ---- HASHING.md ----------------------------------------------------- */
/* the two-letter slots print a real word in title case, not a bare letter,
   so there is no case flip any more and CASE_FLIP is gone */
const TWOS = document.getElementById("twoletter").textContent
  .trim().split(/\s+/).map(w => w[0] + w.slice(1).toLowerCase());

const SETS = [
  [..."!@#^&*"],   // 6
  TWOS,            // 72, title case
  TWOS,            // 72, title case
  [..."123456789"] // 9
];

/* Each slot drops its own digit and reads the other three as a base-6 number,
   but ORDER says which surviving digit takes the leading (x36) place. Slots
   0-2 read their kept digits in ascending order; slot 3 swaps its first two.

   That swap is what keeps the map injective. Read ascending everywhere, d0
   lands on the x36 place in all three non-zero slots, and 36*2 is a multiple
   of the 72-word modulus -- so d0 survives only as parity and the 1296 codes
   collapse to 432 hashes. Rotating slot 3 puts d0 on the x6 place, where the
   modulus does not divide it, and the map becomes a bijection again.

   ORDER[slot] = digit indices, most significant first; slot s omits s. */
const ORDER = [[1,2,3], [0,2,3], [0,1,3], [1,0,2]];

// 1235 -> 235, 135, 125, 251. The last is d2 d1 d0, not d0 d1 d2.
function hashOf(code){
  const d = code.split("").map(Number);
  return SETS.map((chars, slot) => {
    const n = ORDER[slot].reduce((acc, i) => acc*6 + d[i], 0);
    return chars[n % chars.length];
  }).join("");
}

/* ---- list ------------------------------------------------------------ */
const raw = document.getElementById("wordlist").textContent.trim().split(/\r?\n/);
const ENTRIES = raw.map(l => {
  const [code, word] = l.split("\t");
  return { code, word };
});

/* uniform 0..n-1 from the CSPRNG, rejection sampled so there is no modulo skew */
function randBelow(n){
  const buf = new Uint32Array(1);
  const limit = Math.floor(2**32 / n) * n;
  let v;
  do { crypto.getRandomValues(buf); v = buf[0]; } while (v >= limit);
  return v % n;
}
const roll = () => randBelow(6) + 1;
const code4 = () => [roll(), roll(), roll(), roll()].join("");

/* ---- output ---------------------------------------------------------- */
const $ = id => document.getElementById(id);

/* colour is fixed by position: token i always gets PALETTE[i % 6], so the
   pattern is identical on every generate and adjacent tokens never collide */
const PALETTE = ["--w1", "--w2", "--w3", "--w4", "--w5", "--w6"];
const tint = i => ` style="color:var(${PALETTE[i % PALETTE.length]})"`;

/* ---- postprocessing ---------------------------------------------------- */
/* Cosmetic only: these reshape the words already drawn, never reroll them,
   and never touch the hash -- re-casing it would change the fixed string a
   code maps to. */
const titleCase = s => s.replace(/[a-z]+/g, w => w[0].toUpperCase() + w.slice(1));

/* the last draw, kept so an option change re-renders instead of regenerating */
let LAST = null;

/* draw new words + hash, then paint */
function generate(){
  const n = +$("n").value;
  const picks = Array.from({ length: n }, () => ENTRIES[randBelow(ENTRIES.length)]);
  const hcode = code4();
  LAST = { words: picks.map(p => p.word), codes: picks.map(p => p.code),
           hcode, hash: hashOf(hcode) };
  render();
}

/* paint LAST through the current options */
function render(){
  if (!LAST) return;
  const sep = $("sep").value;
  const shown = $("tc").checked ? LAST.words.map(titleCase) : LAST.words;

  $("phrase").innerHTML =
    shown.map((w, i) => `<span class="w"${tint(i)}>${esc(w)}</span>`).join(sep)
      + `<span class="h"${tint(shown.length)}>${esc(LAST.hash)}</span>`;
  $("rwords").textContent = shown.join("  ");
  $("rcodes").textContent = LAST.codes.join(" ");
  $("rcode").textContent  = LAST.hcode;
  $("rhash").textContent  = LAST.hash;
  /* the hash rides on the last word with no separator, as before */
  $("phrase").dataset.value = shown.join(sep) + LAST.hash;
}

function esc(s){ return s.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

$("f").addEventListener("submit", e => { e.preventDefault(); generate(); });
/* option changes only repaint the current draw */
$("tc").addEventListener("change", render);
$("sep").addEventListener("change", render);
$("copy").addEventListener("click", async () => {
  const b = $("copy"), t = b.textContent;
  try {
    await navigator.clipboard.writeText($("phrase").dataset.value || "");
    b.textContent = "copied";
  } catch { b.textContent = "press ⌘C"; }
  setTimeout(() => { b.textContent = t; }, 1200);
});

/* ---- boot ------------------------------------------------------------ */
const bad = [];
if (ENTRIES.length !== 1296) bad.push("count");
if (new Set(ENTRIES.map(e => e.word)).size !== 1296) bad.push("dup word");
if (TWOS.length !== 72) bad.push("twos count");
if (new Set(TWOS).size !== 72) bad.push("twos dup");
if (!TWOS.every(w => /^[A-Z][a-z]$/.test(w))) bad.push("twos case");
if (hashOf("1235") !== "*PaMu1") bad.push("1235");
if (hashOf("1111") !== "@GuGu8") bad.push("1111");
if (titleCase("polar bear") !== "Polar Bear") bad.push("titleCase");

/* the hash must stay a bijection on the 1296-code space: a checker that
   collides on 3 codes per hash silently stops catching some typos */
const HASHES = new Set();
for (let a = 1; a <= 6; a++) for (let b = 1; b <= 6; b++)
  for (let c = 1; c <= 6; c++) for (let e = 1; e <= 6; e++)
    HASHES.add(hashOf(`${a}${b}${c}${e}`));
if (HASHES.size !== 1296) bad.push(`hash not injective (${HASHES.size}/1296)`);
const st = $("status");
if (bad.length){ st.textContent = "selftest FAIL: " + bad.join(", "); st.className = "bad"; }
else { st.textContent = `${ENTRIES.length} words loaded \u00b7 selftest pass`; st.className = "ok"; }

generate();
</script>
